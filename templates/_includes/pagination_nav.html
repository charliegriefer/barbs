<div id="pagination_navigation" class="py-4">
  <nav>
    <ul class="pagination justify-content-center flex-wrap">
      <li class="page-item{% if current_page == 1 %} disabled{% endif %}">
        <a class="page-link" href="{{ calculate_page_link(current_page - 1, qs) }}" tabindex="-1"><i class="bi bi-chevron-left" title="Previous Page"></i></a>
      </li>
      {% for page in page_range %}
        {% if page is none %}
          <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
        {% elif current_page == page %}
          <li class="page-item active">
            <span class="page-link">{{ page }}</span>
          </li>
        {% else %}
          <li class="page-item"><a class="page-link" href="{{ calculate_page_link(page, qs) }}">{{ page }}</a></li>
        {% endif %}
      {% endfor %}
      <li class="page-item{% if current_page == number_of_pages %} disabled{% endif %}">
        <a class="page-link" href="{{ calculate_page_link(current_page + 1, qs) }}"><i class="bi bi-chevron-right" title="Next Page"></i></a>
      </li>
    </ul>
  </nav>
</div>
